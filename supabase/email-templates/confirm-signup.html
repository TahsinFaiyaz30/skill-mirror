<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>Confirm your email</title>
  <style>
    @media only screen and (max-width: 480px) {
      .canvas { padding: 16px 10px !important; }
      .panel { padding-left: 20px !important; padding-right: 20px !important; }
      .headline { font-size: 27px !important; line-height: 33px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f2f4f1;color:#1c1d20;font-family:Arial, Helvetica, sans-serif;">
  <div aria-hidden="true" style="display:none!important;visibility:hidden;opacity:0;color:transparent;height:0;width:0;overflow:hidden;mso-hide:all;">Verify your email to finish setting up SkillMirror.</div>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="#f2f4f1" style="background-color:#f2f4f1;">
    <tr>
      <td class="canvas" align="center" style="padding:36px 14px;">
        <!--[if mso]><table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600"><tr><td><![endif]-->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="#ffffff" style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #daddd7;border-radius:16px;">
          <tr>
            <td class="panel" bgcolor="#1c1d20" style="padding:22px 36px;border-bottom:4px solid #ffc928;border-radius:15px 15px 0 0;background-color:#1c1d20;color:#ffffff;font:700 24px/30px Arial, Helvetica, sans-serif;letter-spacing:-0.6px;">
              Skill<span style="color:#ffc928;">Mirror</span>
            </td>
          </tr>
          <tr>
            <td class="panel" style="padding:30px 36px 28px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="table-layout:fixed;">
                <tr>
                  <td style="padding:0 0 10px;color:#745500;font:700 12px/18px Arial, Helvetica, sans-serif;letter-spacing:1.2px;text-transform:uppercase;">
                    Account setup
                  </td>
                </tr>
                <tr>
                  <td style="padding:0 0 14px;">
                    <h1 class="headline" style="margin:0;color:#1c1d20;font:700 34px/40px Arial, Helvetica, sans-serif;letter-spacing:-0.8px;overflow-wrap:anywhere;">Confirm your email</h1>
                  </td>
                </tr>
                <tr>
                  <td style="padding:0 0 24px;color:#55585d;font:400 16px/25px Arial, Helvetica, sans-serif;overflow-wrap:anywhere;">
                    Thanks for signing up for SkillMirror. Confirm your email address to finish creating your account.
                  </td>
                </tr>
                <tr>
    <td style="padding:0 0 26px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td align="center" bgcolor="#ffc928" style="background-color:#ffc928;border-radius:8px;mso-padding-alt:14px 22px;">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=signup&amp;next={{ .RedirectTo }}" style="display:inline-block;padding:14px 22px;border-radius:8px;color:#1c1d20;font:700 16px/20px Arial, Helvetica, sans-serif;text-decoration:none;mso-padding-alt:0;">
              Confirm email
            </a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
                <tr>
                  <td style="padding:16px 0 0;border-top:1px solid #daddd7;color:#55585d;font:400 13px/21px Arial, Helvetica, sans-serif;">
                    If you didn’t sign up for SkillMirror, you can ignore this email.
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
